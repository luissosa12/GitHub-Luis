<!DOCTYPE html>
<html>
    <head>
        <meta charset ="utf-8">
        <title> Mi formulario</title>
        <link rel="icon" href="images/us-mini.ico">
    </head>
    <body>
        <header>
            <h1>Formulario</h1>
            <h2>Registro de usuario</h2>
            <hr>
        </header>
        <main>
            <!-- form local 
            <form action = "Response.html" target="_blank">
            -->
            <form method="post" action="https://www.w3schools.com/action_page.php" target="_blank" ></form>"
                <section> <!-- Elementos del formulario -->
                    <fieldset>
                        <legend>Datos personales</legend>
                        <label>Nombre y apellidos
                            <input type="text" name="Nombre">
                        </label>
                        <label>Fecha Nacimiento
                            <input type="date" name="fNacimiento" max="2007-12-31" min="1959-12-31">
                        </label>
                        <label>Región
                            <select name="Region">
                                <option value="AN">Andalucia</option>
                                <option value="CM">Castilla la Mancha</option>
                                <option selected value="EX">Extremadura</option>
                                <option value="M">Madrid</option>
                            </select>
                        </label>
                    </fieldset>
                    <fieldset>
                        <legend>Datos de usuario</legend>
                    </fieldset>
                </section>
                <section> <!-- Botones -->
                    <input type="submit">
                    <input type="reset">
                </section>
            </form>
        </main>
        <footer>
            <hr>
            <p>&copy; TI</p>    
        </footer>
    </body>
</html>
